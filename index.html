<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Averating</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="reset.css">
</head>
<body>
    <main>
        <!-- HOME PAGE -->
        <section id="home" class="container">
            <h1 class="title">Choose a grading method</h1>

            <section class="reviews">
                <button class="btn-default">Default</button>
                <button class="btn-advanced">Advanced</button>
            </section>      
        </section>

        <!-- DEFAULT PAGE -->
        <section id="default-page" class="hidden current-page">
            <h1>Default Rating</h1>

            <form class="form">
                    <input type="number" min="1" step="any" max="10" placeholder="Animation" class="input-categories" required>
                    <input type="number" min="1" step="any" max="10"  placeholder="Story" class="input-categories" required>
                    <input type="number" min="1" step="any" max="10"  placeholder="Characters" class="input-categories" required>
                    <input type="number" min="1" step="any" max="10"  placeholder="Ambient" class="input-categories" required>
                    <input type="number" min="1" step="any" max="10"  placeholder="Climax" class="input-categories" required>
    
                <button class="btn-back" type="click">Back</button>
                <button class="btn-calculate" type="submit">Calculate</button>
            </form>
            <p class="result"></p>
        </section>

        <!-- ADVANCED PAGE -->
        <section id="advanced-page" class="hidden current-page">
            <h1>Advanced Rating</h1>

            <form class="form">
                <div>
                    <h2>Animation</h2>
                    <input type="number" min="1" step="any" max="10" placeholder="Lines" class="input-categories" required>
                    <input type="number" min="1" step="any" max="10" placeholder="Background" class="input-categories" required>
                    <input type="number" min="1" step="any" max="10" placeholder="Outfits" class="input-categories" required>
                    <input type="number" min="1" step="any" max="10" placeholder="Draw details" class="input-categories" required>
                    <input type="number" min="1" step="any" max="10" placeholder="Fluidity" class="input-categories" required>
                </div>

                <div>
                    <h2>Story</h2>
                    <input type="number" min="1" step="any" max="10" placeholder="Main story" class="input-categories" required>
                    <input type="number" min="1" step="any" max="10" placeholder="Side story" class="input-categories" required>
                    <input type="number" min="1" step="any" max="10" placeholder="Story telling" class="input-categories" required>
                    <input type="number" min="1" step="any" max="10" placeholder="Story details" class="input-categories" required>
                </div>

                <div>
                    <h2>Characters</h2>
                    <input type="number" min="1" step="any" max="10" placeholder="Characters story" class="input-categories" required>
                    <input type="number" min="1" step="any" max="10" placeholder="Second characters" class="input-categories" required>
                    <input type="number" min="1" step="any" max="10" placeholder="Main character" class="input-categories" required>
                    <input type="number" min="1" step="any" max="10" placeholder="Character developing" class="input-categories" required>
                </div>

                <div>
                    <h2>Ambient</h2>
                    <input type="number" min="1" step="any" max="10" placeholder="General developing" class="input-categories" required>
                    <input type="number" min="1" step="any" max="10" placeholder="General details" class="input-categories" required>
                    <input type="number" min="1" step="any" max="10" placeholder="Opening" class="input-categories" required>
                    <input type="number" min="1" step="any" max="10" placeholder="Soundtrack" class="input-categories" required>
                    <input type="number" min="1" step="any" max="10" placeholder="Dubbing" class="input-categories" required>
                    <input type="number" min="1" step="any" max="10" placeholder="Fixation" class="input-categories" required>
                </div>

                <div>
                    <h2>Climax</h2>
                    <input type="number" min="1" step="any" max="10" placeholder="Climax" class="input-categories" required>
                    <input type="number" min="1" step="any" max="10" placeholder="Plot" class="input-categories" required>
                    <input type="number" min="1" step="any" max="10" placeholder="Gaps" class="input-categories" required>
                    <input type="number" min="1" step="any" max="10" placeholder="Stalling" class="input-categories" required>
                </div>

                <button class="btn-back" type="click">Back</button>
                <button class="btn-calculate">Calculate</button>
            </form>

            <p class="result"></p>
        </section>
    </main>
    
    <script src="script.js"></script>
</body>
</html>
